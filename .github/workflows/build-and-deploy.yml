name: Build and deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Deploy web app to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_GRAPHQL_ENDPOINT: ${{ vars.VITE_GRAPHQL_ENDPOINT || 'https://politiaware-api-render.samadhikar.com/graphql/async/' }}
          VITE_SECONDARY_GRAPHQL_ENDPOINT: ${{ vars.VITE_SECONDARY_GRAPHQL_ENDPOINT || 'https://politiaware-api-gcp.samadhikar.com/graphql/async/' }}
          VITE_PRIMARY_TIMEOUT_MS: '2000'
          VITE_SECONDARY_TIMEOUT_MS: '3000'

      - name: Deploy dist to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name "${CLOUDFLARE_PAGES_PROJECT:-politiaware-react}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
        env:
          VITE_GRAPHQL_ENDPOINT: ${{ vars.VITE_GRAPHQL_ENDPOINT || 'https://politiaware-api-render.samadhikar.com/graphql/async/' }}
          VITE_SECONDARY_GRAPHQL_ENDPOINT: ${{ vars.VITE_SECONDARY_GRAPHQL_ENDPOINT || 'https://politiaware-api-gcp.samadhikar.com/graphql/async/' }}
          VITE_PRIMARY_TIMEOUT_MS: '2000'
          VITE_SECONDARY_TIMEOUT_MS: '3000'
      - run: npx cap add android
        if: ${{ !hashFiles('android/settings.gradle', 'android/settings.gradle.kts') }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: politiaware-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk